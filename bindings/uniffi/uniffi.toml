# Passed to uniffi-bindgen via --config. UniFFI 0.32 "global config" format:
# per-crate settings live under [crates.<crate_name>]. (A uniffi.toml next to
# the crate is only auto-discovered via `cargo metadata`, which we disable.)
#
# Two crates carry UniFFI metadata: calc_ui (the records a renderer draws)
# and calc_ffi (the CalculatorUi object and keypad()). The bindgen generates
# one Swift file and one Kotlin file per crate.

[crates.calc_ffi.bindings.kotlin]
package_name = "dev.mashuda.calc"
# Name JNA loads (lib<name>.so / .dylib). Must be explicit: the default is
# derived from the input library's filename, and rules_rust rlibs carry a
# hash suffix (libcalc_ffi-1523509694.rlib). On Android this must match the
# packaged .so; note android_binary merges all native deps into
# lib<android_binary name>.so.
cdylib_name = "calc_ffi"

# The records. Their own package, because every generated Kotlin file
# declares the same helpers (RustBuffer, UniffiLib...) at package level, so
# two files in one package would be a redeclaration error. The calc_ffi file
# imports from here; app code reaches the types as dev.mashuda.calc.ui.*.
[crates.calc_ui.bindings.kotlin]
package_name = "dev.mashuda.calc.ui"
cdylib_name = "calc_ffi"

# Swift has no such clash: both generated files compile into the one CalcFFI
# module, and the generated code assumes exactly that (it references the
# other crate's types without an import). Both files `import calc_ffiFFI`,
# the single Clang module holding both C headers; the header file name is
# overridden so the two headers do not collide in the output directory.
[crates.calc_ui.bindings.swift]
ffi_module_name = "calc_ffiFFI"
ffi_module_filename = "calc_uiFFI"
